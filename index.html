<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avery Lending Inc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A5B;--blue:#1F4FA3;--red:#C8102E;--white:#fff;--ice:#EEF3FB;--ink:#12213D;--line:#D5DEEE}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.6}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5em}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:4px solid var(--red)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:Fraunces,serif;font-weight:800;font-size:1.3rem;color:var(--navy);text-decoration:none}
.logo b{color:var(--red)}
nav a{margin-left:20px;text-decoration:none;font-weight:500;color:var(--navy)}
nav a:hover{color:var(--red)}
.btn{display:inline-block;background:var(--red);color:#fff;border:0;padding:14px 26px;font:700 1rem Figtree,sans-serif;border-radius:6px;text-decoration:none;cursor:pointer}
.btn:hover{background:#a50d26}
.btn.alt{background:#fff;color:var(--navy)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,var(--red) 33.3%,#fff 33.3% 66.6%,var(--blue) 66.6%)}
.hero .wrap{padding:84px 20px 96px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);font-weight:800}
.hero p{font-size:1.15rem;max-width:34em;color:#DCE6F7}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.quote{background:#fff;color:var(--ink);border-radius:10px;padding:26px;border-top:6px solid var(--red)}
.quote h3{color:var(--navy);font-size:1.25rem}
.quote dl{margin:0}
.quote dt{font-size:.85rem;color:#58688A}
.quote dd{margin:0 0 12px;font-weight:700;font-size:1.15rem;color:var(--navy)}
section{padding:72px 0}
section.tint{background:var(--ice)}
h2{font-size:clamp(1.7rem,3.5vw,2.4rem);color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:28px}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:6px;padding:22px}
.card:nth-child(even){border-left-color:var(--red)}
.card h3{font-size:1.2rem;color:var(--navy)}
.card p{margin:0 0 8px}
.card .meta{font-weight:700;color:var(--red)}
ol.steps{padding-left:1.2em;max-width:42em}
ol.steps li{margin-bottom:10px}
form{background:#fff;border:1px solid var(--line);border-top:6px solid var(--red);border-radius:8px;padding:28px;margin-top:24px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-family:Fraunces,serif;font-weight:700;font-size:1.2rem;color:var(--navy);padding:0;margin-bottom:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
label{display:block;font-weight:500;font-size:.95rem}
input,select,textarea{width:100%;margin-top:4px;padding:11px 12px;font:inherit;border:1px solid #9FB1D1;border-radius:6px;background:#fff;color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
.check input{width:auto;margin-top:6px}
#status{margin-top:16px;font-weight:700}
.hp{position:absolute;left:-9999px}
footer{background:var(--navy);color:#DCE6F7;padding:40px 0;border-top:8px solid var(--red)}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
footer h3{color:#fff;font-size:1.1rem}
footer p{margin:0 0 4px}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr;padding:56px 20px 68px}nav a:not(.btn){display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="#top" data-text="company"></a>
    <nav><a href="#loans">Loans</a><a href="#how">How it works</a><a href="#contact">Contact</a><a class="btn" href="#apply" style="color:#fff;padding:9px 18px">Apply now</a></nav>
  </div>
</header>

<main id="top">
<div class="hero">
  <div class="wrap">
    <div>
      <h1 data-text="heroTitle"></h1>
      <p data-text="heroText"></p>
      <div class="actions"><a class="btn" href="#apply">Apply online</a><a class="btn alt" href="#loans">See loan options</a></div>
    </div>
    <aside class="quote" aria-label="Quick facts">
      <h3>At a glance</h3>
      <dl id="facts"></dl>
    </aside>
  </div>
</div>

<section id="loans">
  <div class="wrap">
    <h2>Loans for what you need</h2>
    <div class="grid" id="loanGrid"></div>
  </div>
</section>

<section id="how" class="tint">
  <div class="wrap">
    <h2>How it works</h2>
    <ol class="steps" id="steps"></ol>
  </div>
</section>

<section id="apply">
  <div class="wrap">
    <h2>Apply online</h2>
    <p data-text="applyIntro"></p>
    <form id="applyForm" method="POST">
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
      <input type="hidden" name="_subject" value="New loan application – Avery Lending Inc.">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" id="nextUrl" value="">
      <fieldset>
        <legend>About you</legend>
        <div class="row">
          <label>Full name<input name="Full name" required autocomplete="name"></label>
          <label>Mobile number<input name="Mobile" type="tel" required autocomplete="tel"></label>
          <label>Email address<input name="Email" type="email" required autocomplete="email"></label>
          <label>Date of birth<input name="Birthdate" type="date" required></label>
        </div>
        <label style="margin-top:16px">Home address<input name="Address" required autocomplete="street-address"></label>
      </fieldset>
      <fieldset>
        <legend>Work and income</legend>
        <div class="row">
          <label>Employer or business name<input name="Employer" required></label>
          <label>Position or type of business<input name="Position" required></label>
          <label>Monthly income (₱)<input name="Monthly income" type="number" min="0" required></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Your loan</legend>
        <div class="row">
          <label>Loan type<select name="Loan type" id="loanType" required></select></label>
          <label>Amount needed (₱)<input name="Amount" type="number" min="1000" step="500" required></label>
          <label>Preferred term<select name="Term" id="termSel" required></select></label>
        </div>
        <label style="margin-top:16px">Purpose of the loan<textarea name="Purpose" rows="3" required></textarea></label>
      </fieldset>
      <div class="check"><input type="checkbox" id="agree" required><label for="agree" data-text="consent"></label></div>
      <button class="btn" type="submit">Send application</button>
      <p id="status" role="status"></p>
    </form>
  </div>
</section>
</main>

<footer id="contact">
  <div class="wrap">
    <div><h3 data-text="company"></h3><p data-text="tagline"></p></div>
    <div><h3>Contact us</h3><p data-text="address"></p><p data-text="phone"></p><p><a id="mailLink"></a></p><p data-text="hours"></p></div>
    <div><p>© <span id="yr"></span> <span data-text="company"></span>. All rights reserved.</p></div>
  </div>
</footer>

<script>
/* =====================================================================
   EDIT THIS BLOCK TO CHANGE THE SITE. No other code needs to be touched.
   ===================================================================== */
const CONFIG = {
  /* Where applications are sent. First address is the main recipient;
     the rest receive a copy. Add or remove addresses any time. */
  recipients: ["herbertyanson@gmail.com", "microfinance@averylending.net"],

  company: "Avery Lending Inc.",
  tagline: "Fair, fast and friendly loans.",
  heroTitle: "Funding for your next step, made simple.",
  heroText: "Apply online in a few minutes. Our team reviews every application and gets back to you with clear terms and no hidden charges.",
  applyIntro: "Fill in the form below. Your application goes straight to our loan team, and we will contact you using the details you provide.",
  consent: "I confirm the information above is true and I allow Avery Lending Inc. to contact me and verify my details.",
  address: "Your office address here",
  phone: "Your phone number here",
  contactEmail: "microfinance@averylending.net",
  hours: "Mon–Fri, 8:00 AM – 5:00 PM",

  facts: [
    ["Loan amounts", "₱5,000 – ₱200,000"],
    ["Terms", "3 to 24 months"],
    ["Response time", "Within 1 business day"]
  ],

  loans: [
    {name: "Personal loan", text: "For emergencies, bills, tuition and everyday needs.", meta: "Rates: edit in CONFIG"},
    {name: "Business loan", text: "Working capital for small shops, stalls and growing enterprises.", meta: "Rates: edit in CONFIG"},
    {name: "Salary loan", text: "Quick cash for employed borrowers, paid through salary deduction.", meta: "Rates: edit in CONFIG"}
  ],

  terms: ["3 months", "6 months", "12 months", "18 months", "24 months"],

  steps: [
    "Send your application using the form on this page.",
    "Our loan officer contacts you to confirm details and requirements.",
    "Your application is reviewed and you receive the loan terms.",
    "Sign the agreement and receive your funds."
  ]
};
/* ===================================================================== */

(function(){
  const $ = s => document.querySelector(s);
  document.querySelectorAll("[data-text]").forEach(el => {
    el.textContent = CONFIG[el.dataset.text];
  });
  const logo = $(".logo");
  const parts = CONFIG.company.split(" ");
  logo.innerHTML = "";
  logo.append(parts[0] + " ");
  const b = document.createElement("b");
  b.textContent = parts.slice(1).join(" ");
  logo.append(b);
  document.title = CONFIG.company;
  $("#yr").textContent = new Date().getFullYear();

  const mail = $("#mailLink");
  mail.textContent = CONFIG.contactEmail;
  mail.href = "mailto:" + CONFIG.contactEmail;

  CONFIG.facts.forEach(([k, v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    $("#facts").append(dt, dd);
  });

  CONFIG.loans.forEach(l => {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = "<h3></h3><p></p><p class='meta'></p>";
    d.children[0].textContent = l.name;
    d.children[1].textContent = l.text;
    d.children[2].textContent = l.meta;
    $("#loanGrid").append(d);
    $("#loanType").add(new Option(l.name, l.name));
  });
  CONFIG.terms.forEach(t => $("#termSel").add(new Option(t, t)));
  CONFIG.steps.forEach(s => { const li = document.createElement("li"); li.textContent = s; $("#steps").append(li); });

  /* Form: delivered by email through FormSubmit (formsubmit.co).
     First address is the main recipient, the others get a copy. */
  const form = $("#applyForm");
  const [main, ...cc] = CONFIG.recipients;
  form.action = "https://formsubmit.co/" + encodeURIComponent(main);
  if (cc.length) {
    const i = document.createElement("input");
    i.type = "hidden"; i.name = "_cc"; i.value = cc.join(",");
    form.prepend(i);
  }
  $("#nextUrl").value = location.href.split("#")[0] + "?sent=1#apply";
  if (location.search.includes("sent=1")) {
    $("#status").style.color = "#1F4FA3";
    $("#status").textContent = "Thank you. Your application was sent. We will contact you soon.";
  }
  form.addEventListener("submit", () => {
    $("#status").style.color = "#0B2A5B";
    $("#status").textContent = "Sending your application...";
  });
})();
</script>
</body>
</html>
